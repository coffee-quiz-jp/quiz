<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Black Apron 対策</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c130b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Black Apron">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html,body{margin:0;padding:0;background:#1c130b;color:#f3e9d9;-webkit-text-size-adjust:100%;}
  #root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:#1c130b;font-family:-apple-system,BlinkMacSystemFont,sans-serif;gap:14px;z-index:9999;
        padding:24px;box-sizing:border-box;}
  :root{--boot-eye:#c9954e;--boot-sub:#a98d6a;--boot-err:#e08b6d;--boot-fg:#e6c98d;}
  #boot .e{font-size:11px;letter-spacing:.28em;color:var(--boot-eye);font-weight:700;}
  #boot .m{font-size:13px;color:var(--boot-sub);text-align:center;line-height:1.7;}
  #boot .sp{width:26px;height:26px;border:3px solid #4a361d;border-top-color:#c9954e;border-radius:50%;
            animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  #lock{display:none;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:300px;}
  #lock input{width:100%;box-sizing:border-box;background:#2b1e11;border:1.5px solid #6b4f27;border-radius:12px;
              color:#f3e9d9;font-size:16px;padding:13px 14px;text-align:center;letter-spacing:.1em;outline:none;}
  #lock input:focus{border-color:#c9954e;}
  #lock button{width:100%;background:#c9954e;color:#20150a;border:none;border-radius:12px;
               padding:14px;font-size:15px;font-weight:700;cursor:pointer;}
  #lock button:disabled{opacity:.5;}
  #lockerr{font-size:12px;color:var(--boot-err);min-height:16px;text-align:center;}
</style>
</head>
<body>
<div id="root"></div>
<div id="boot">
  <div class="e">BLACK APRON</div>
  <div class="sp" id="bootsp"></div>
  <div class="m" id="bootmsg">読み込み中…</div>
  <div id="lock">
    <input id="passinput" type="password" placeholder="合言葉を入力" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="passbtn">開く</button>
    <div id="lockerr"></div>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
        integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
        integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
        crossorigin="anonymous"></script>
<script>
(function () {
  var BUILD = "129";                       // 中身を更新したら大きくする（sw.js の CACHE も揃える）
  window.__BUILD = BUILD;                 // アプリ内のフッターに出す（古い版を掴んでいないか確認用）

  /* テーマ（茶／緑）に合わせて、アプリの外側（ステータスバー・safe-area・オーバースクロール域）も塗る。
     緑テーマは背景が明るいので、black-translucent のままだと白文字のステータスバーが読めなくなる */
  window.__applyShellTheme = function (t) {
    var green = t === "green";
    var bg = green ? "#f2f7f4" : "#1c130b";
    var fg = green ? "#1e3932" : "#f3e9d9";
    try {
      document.documentElement.style.background = bg;
      if (document.body) { document.body.style.background = bg; document.body.style.color = fg; }
      var boot = document.getElementById("boot");
      if (boot) { boot.style.background = bg; boot.style.color = fg; }
      // 起動画面（#boot）の文字色。緑の明るい背景では茶テーマ用の金色・薄茶が読めない（比1.5〜2.9）
      var rs = document.documentElement.style;
      rs.setProperty("--boot-eye", green ? "#1e5c41" : "#c9954e");
      rs.setProperty("--boot-sub", green ? "#4a6b5f" : "#a98d6a");
      rs.setProperty("--boot-err", green ? "#b4482e" : "#e08b6d");
      rs.setProperty("--boot-fg",  green ? "#1e3932" : "#e6c98d");
      var tc = document.querySelector('meta[name="theme-color"]');
      if (tc) tc.setAttribute("content", bg);
      var sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
      if (sb) sb.setAttribute("content", green ? "default" : "black-translucent");
    } catch (e) {}
  };
  try { window.__applyShellTheme(localStorage.getItem("bp-theme") === "green" ? "green" : "brown"); } catch (e) {}
  var KKEY  = "bp_key_v1";                // 解錠済みの鍵（この端末のみ）
  var CPRE  = "bp_compiled_";             // 変換済みコードのキャッシュ（中身のハッシュで管理）
  var ITER  = 310000;

  var msg   = document.getElementById("bootmsg");
  var boot  = document.getElementById("boot");
  var sp    = document.getElementById("bootsp");
  var lock  = document.getElementById("lock");
  var input = document.getElementById("passinput");
  var btn   = document.getElementById("passbtn");
  var lerr  = document.getElementById("lockerr");

  function say(t) { if (msg) msg.textContent = t; }
  function fail(t) {
    boot.innerHTML = '<div style="padding:24px;color:var(--boot-fg);font-size:13px;line-height:1.7;text-align:center">'
      + '起動できませんでした<br><span style="color:var(--boot-sub)">' + t + '</span></div>';
  }
  function run(code) { new Function(code)(); }

  /* ---- 暗号まわり ---- */
  function parseEnc(buf) {
    var u = new Uint8Array(buf);
    if (u.length < 33 || u[0] !== 66 || u[1] !== 80 || u[2] !== 69 || u[3] !== 49) // "BPE1"
      throw new Error("暗号化ファイルの形式が不正です");
    return { salt: u.slice(4, 20), iv: u.slice(20, 32), ct: u.slice(32) };
  }
  function deriveKey(pass, salt) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function (bk) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" },
          bk, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
      });
  }
  function importStoredKey() {
    try {
      var b64 = localStorage.getItem(KKEY);
      if (!b64) return Promise.resolve(null);
      var raw = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
      return crypto.subtle.importKey("raw", raw, "AES-GCM", true, ["encrypt", "decrypt"])
        .catch(function () { return null; });
    } catch (e) { return Promise.resolve(null); }
  }
  function storeKey(key) {
    return crypto.subtle.exportKey("raw", key).then(function (raw) {
      try {
        var b = ""; var u = new Uint8Array(raw);
        for (var i = 0; i < u.length; i++) b += String.fromCharCode(u[i]);
        localStorage.setItem(KKEY, btoa(b));
      } catch (e) {}
    });
  }
  function decrypt(key, encBuf) {
    var p = parseEnc(encBuf);
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: p.iv }, key, p.ct)
      .then(function (plain) { return new TextDecoder().decode(plain); });
  }
  function pruneCompiled(keep) {
    try {
      Object.keys(localStorage).forEach(function (k) {
        if (k.indexOf(CPRE) === 0 && k !== keep) localStorage.removeItem(k);
      });
    } catch (e) {}
  }
  function askPass(errText) {
    sp.style.display = "none";
    say("このアプリはパスコードで保護されています");
    lock.style.display = "flex";
    lerr.textContent = errText || "";
    input.value = ""; input.focus();
    return new Promise(function (res) {
      function go() {
        var v = input.value.trim();
        if (!v) return;
        btn.removeEventListener("click", go);
        input.removeEventListener("keydown", onkey);
        lock.style.display = "none";
        sp.style.display = "";
        res(v);
      }
      function onkey(e) { if (e.key === "Enter") go(); }
      btn.addEventListener("click", go);
      input.addEventListener("keydown", onkey);
    });
  }

  (async function () {
    try {
      if (!(window.crypto && crypto.subtle))
        return fail("この環境では暗号機能が使えません（HTTPSで開いてください）");

      /* URLに版番号を付ける。付けないと古いキャッシュがそのまま返ってきて、
         中身だけ前のまま…という状態になる */
      var q = "?v=" + BUILD;
      var res1, res2;
      try {
        res1 = await fetch("app.enc" + q);
        res2 = await fetch("assets.enc" + q);
      } catch (e0) {
        throw new Error("データを取得できませんでした。電波のある場所で一度開くと、以後はオフラインでも使えます");
      }
      if (!res1.ok || !res2.ok) throw new Error("データを取得できませんでした（" + (res1.ok ? res2.status : res1.status) + "）");
      /* 初回インストール時はまだ Service Worker が無く、この fetch はSWのキャッシュ保存を通らない。
         そのため取得できたものをここで自分でオフライン用キャッシュに書いておく
         （キャッシュ名は sw.js の CACHE と同じ規則。キーは版無しの app.enc にして、SW側の
           ignoreSearch 照合と揃える）。SW経由のときは二重に同じものを書くだけで害は無い */
      try {
        if (window.caches) {
          var c1 = res1.clone(), c2 = res2.clone();
          caches.open("bp-cache-v" + BUILD).then(function (c) {
            c.put("app.enc", c1).catch(function () {});
            c.put("assets.enc", c2).catch(function () {});
          }).catch(function () {});
        }
      } catch (e1) {}
      var appEnc = await res1.arrayBuffer();
      var assetsEnc = await res2.arrayBuffer();
      var salt = parseEnc(appEnc).salt;

      /* 鍵の用意：保存済みならそれを使い、なければ合言葉から導出。
         復号に失敗したら（合言葉違い・変更後など）入力し直し。 */
      var key = await importStoredKey();
      var assetsText = null, errText = "", typed = false;
      for (;;) {
        if (!key) {
          var pass = await askPass(errText);
          say("確認しています…");
          key = await deriveKey(pass, salt);
          typed = true;   // ここから先の失敗は「入力した合言葉が違う」
        }
        try { assetsText = await decrypt(key, assetsEnc); break; }
        catch (e) {
          try { localStorage.removeItem(KKEY); } catch (e2) {}
          /* 保存済みの鍵が合わなかっただけ（合言葉変更後の初回など）なら
             エラー表示なしで入力を求める。入力した合言葉が違ったときだけ表示する */
          key = null; errText = typed ? "合言葉が違います" : "";
        }
      }
      await storeKey(key);

      run(assetsText);          // window.__IMG を定義
      assetsText = null;

      say("問題データを準備中…");
      /* app.enc の中身は変換済みのJS（手元で esbuild にかけたもの）。
         以前はここでJSXをBabelに変換させていたが、
         ①初回20秒の待ち ②変換結果1.4MBをlocalStorageに常駐 ③3つ目のCDN依存
         がまとめて消えるので、変換は手元で済ませる方式にした（2026-09-09） */
      var src = await decrypt(key, appEnc);
      pruneCompiled(null);   // 旧方式が残した bp_compiled_* を掃除する
      run(src);
      boot.remove();
    } catch (e) {
      fail(String(e && e.message ? e.message : e));
    }
  })();

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
